<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nasos ESP32</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background:#eef3f9; }
    .status-dot { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; }
    .on { background:#28a745; }
    .off { background:#dc3545; }
  </style>
</head>
<body>
<div class="container py-3">
  <h3>Панель насосов ESP32</h3>
  <div class="mb-2">
    <span id="wifi_badge"><span class="status-dot off"></span>Wi‑Fi</span> |
    <span id="nano_badge"><span class="status-dot off"></span>Nano</span> |
    <span id="vfd_badge"><span class="status-dot off"></span>VFD</span>
  </div>

  <div class="row g-3">
    <div class="col-12 col-lg-6">
      <div class="card p-3">
        <h5>Состояние</h5>
        <div>Скважина: <b id="well_current">0 A</b>, <b id="well_pressure">0 bar</b></div>
        <div>Дом: <b id="house_current">0 A</b>, <b id="house_pressure">0 bar</b></div>
        <div>Аварии: Well=<b id="well_alarm">Нет</b>, House=<b id="house_alarm">Нет</b></div>
        <div class="mt-2 d-flex gap-2 flex-wrap">
          <button class="btn btn-sm btn-success" onclick="pumpAction('well','force_on')">Well ON</button>
          <button class="btn btn-sm btn-secondary" onclick="pumpAction('well','force_off')">Well OFF</button>
          <button class="btn btn-sm btn-warning" onclick="pumpAction('well','reset_alarm')">Well reset</button>
        </div>
        <div class="mt-2 d-flex gap-2 flex-wrap">
          <button class="btn btn-sm btn-success" onclick="pumpAction('house','force_on')">House ON</button>
          <button class="btn btn-sm btn-secondary" onclick="pumpAction('house','force_off')">House OFF</button>
          <button class="btn btn-sm btn-warning" onclick="pumpAction('house','reset_alarm')">House reset</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="card p-3">
        <h5>Графики</h5>
        <canvas id="pressureChart" height="120"></canvas>
      </div>
    </div>

    <div class="col-12">
      <div class="card p-3">
        <h5>Настройки</h5>
        <form id="settingsForm" class="row g-2"></form>
        <div class="mt-2">
          <button class="btn btn-primary" onclick="saveSettings(event)">Сохранить</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="card p-3">
        <h5>Логи скважины</h5>
        <pre id="logs_well" style="min-height:180px"></pre>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-danger" onclick="clearLogs('well')">Очистить</button>
          <a class="btn btn-sm btn-outline-primary" href="/download_logs_well">Скачать</a>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="card p-3">
        <h5>Логи дома</h5>
        <pre id="logs_house" style="min-height:180px"></pre>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-danger" onclick="clearLogs('house')">Очистить</button>
          <a class="btn btn-sm btn-outline-primary" href="/download_logs_house">Скачать</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const stateHistory = [];
let chart;
let settingsPayload = { settings: {}, wifi: {} };

const SETTING_FIELDS = [
  'wellDryCurrent','wellOverloadCurrent','wellEmergencyCurrent','wellDryDelayMs','wellOverloadDelayMs',
  'targetMinutes','litersPerMin','setpointBar','houseHystOn','houseHystOff','houseMinFreq','houseMaxFreq',
  'houseDryCurrent','houseOverloadCurrent','houseEmergencyCurrent','houseDryDelayMs','houseOverloadDelayMs'
];
const WIFI_FIELDS = ['staSsid','staPass','apSsid','apPass'];

function setBadge(id, ok, label) {
  document.getElementById(id).innerHTML = `<span class="status-dot ${ok ? 'on':'off'}"></span>${label}`;
}

async function pollState() {
  const res = await fetch('/state');
  if (!res.ok) return;
  const s = await res.json();
  document.getElementById('well_current').innerText = `${s.well_current.toFixed(2)} A`;
  document.getElementById('well_pressure').innerText = `${s.well_pressure.toFixed(2)} bar`;
  document.getElementById('house_current').innerText = `${s.house_current.toFixed(2)} A`;
  document.getElementById('house_pressure').innerText = `${s.house_pressure.toFixed(2)} bar`;
  document.getElementById('well_alarm').innerText = s.well_alarm ? 'Да' : 'Нет';
  document.getElementById('house_alarm').innerText = s.house_alarm ? 'Да' : 'Нет';

  setBadge('wifi_badge', !!s.wifi_connected, 'Wi‑Fi');
  setBadge('nano_badge', !!s.nano_online, s.nano_online ? 'Nano' : 'Nano не отвечает');
  setBadge('vfd_badge', !!s.vfd_online, s.vfd_online ? 'VFD' : 'VFD offline');

  stateHistory.push(s.house_pressure);
  if (stateHistory.length > 30) stateHistory.shift();
  chart.data.labels = stateHistory.map((_, i) => i + 1);
  chart.data.datasets[0].data = stateHistory;
  chart.update();
}

async function pumpAction(unit, action) {
  const body = new URLSearchParams({ unit, action });
  await fetch('/pump', { method: 'POST', body });
}

async function loadLogs() {
  document.getElementById('logs_well').innerText = await (await fetch('/logs_well')).text();
  document.getElementById('logs_house').innerText = await (await fetch('/logs_house')).text();
}

async function clearLogs(type) {
  await fetch(`/clear_logs_${type}`, { method: 'POST' });
  await loadLogs();
}

function renderSettingsForm(payload) {
  const form = document.getElementById('settingsForm');
  form.innerHTML = '';
  for (const k of SETTING_FIELDS) {
    form.insertAdjacentHTML('beforeend', `<div class="col-md-3"><label class="form-label">${k}</label><input class="form-control" id="f_${k}" value="${payload.settings[k]}"></div>`);
  }
  for (const k of WIFI_FIELDS) {
    form.insertAdjacentHTML('beforeend', `<div class="col-md-3"><label class="form-label">${k}</label><input class="form-control" id="f_${k}" value="${payload.wifi[k] ?? ''}"></div>`);
  }
}

async function loadSettings() {
  const payload = await (await fetch('/settings')).json();
  settingsPayload = payload;
  renderSettingsForm(payload);
}

async function saveSettings(e) {
  e.preventDefault();
  for (const k of SETTING_FIELDS) settingsPayload.settings[k] = Number(document.getElementById(`f_${k}`).value);
  for (const k of WIFI_FIELDS) settingsPayload.wifi[k] = document.getElementById(`f_${k}`).value;
  await fetch('/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(settingsPayload)
  });
  alert('Сохранено.');
}

function initChart() {
  chart = new Chart(document.getElementById('pressureChart').getContext('2d'), {
    type: 'line',
    data: { labels: [], datasets: [{ label: 'House pressure', data: [], borderColor: 'rgb(54, 162, 235)' }] },
    options: { animation: false }
  });
}

initChart();
loadSettings();
loadLogs();
pollState();
setInterval(pollState, 1000);
setInterval(loadLogs, 5000);
</script>
</body>
</html>
