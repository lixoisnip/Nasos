<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Панель насосов ESP32</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background:#eef3f9; }
    .tank { width:120px; height:220px; border:2px solid #2b2b2b; border-radius:8px; overflow:hidden; display:flex; flex-direction:column-reverse; }
    .sector { height:25%; border-top:1px solid #aaa; }
    .sector-on { background:#0d6efd; }
    .sector-off { background:#fff; }
    .card { height:100%; }
  </style>
</head>
<body>
<div class="container py-3">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h2 class="m-0">Панель насосов ESP32</h2>
    <div class="d-flex gap-2 flex-wrap">
      <button class="btn btn-primary" onclick="goSettings()">Настройки</button>
      <button class="btn btn-outline-secondary" onclick="loadLogs()">Обновить логи</button>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-12 col-lg-3">
      <div class="card p-3">
        <h5>Уровни бака</h5>
        <div class="d-flex gap-3 align-items-start">
          <div class="tank">
            <div class="sector" id="sector0"></div>
            <div class="sector" id="sector1"></div>
            <div class="sector" id="sector2"></div>
            <div class="sector" id="sector3"></div>
          </div>
          <div><div>L1</div><div>L2</div><div>L3</div><div>L4</div></div>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-4">
      <div class="card p-3">
        <h5>Скважинный насос</h5>
        <p>Ток: <b id="well_current">0 A</b></p>
        <p>Давление: <b id="well_pressure">0 bar</b></p>
        <p>Работа: <b id="last_work_sec">0 s</b></p>
        <p>Пауза: <b id="pause_ms">0 ms</b></p>
        <p>Объём: <b id="total_liters">0 L</b></p>
        <p>Авария: <b id="well_alarm">Нет</b></p>
        <p>Блокировка: <b id="well_blocked">Нет</b></p>
        <div class="d-flex gap-2 flex-wrap">
          <button class="btn btn-warning btn-sm" onclick="pumpAction('well','reset_alarm')">Сброс аварии</button>
          <button class="btn btn-success btn-sm" onclick="pumpAction('well','force_on')">Принудительно ВКЛ</button>
          <button class="btn btn-secondary btn-sm" onclick="pumpAction('well','force_off')">Принудительно ВЫКЛ</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-5">
      <div class="card p-3">
        <h5>Домашний насос</h5>
        <p>Ток: <b id="house_current">0 A</b></p>
        <p>Давление: <b id="house_pressure">0 bar</b></p>
        <p>Авария: <b id="house_alarm">Нет</b></p>
        <p>Блокировка: <b id="house_blocked">Нет</b></p>
        <div class="d-flex gap-2 flex-wrap">
          <button class="btn btn-warning btn-sm" onclick="pumpAction('house','reset_alarm')">Сброс аварии</button>
          <button class="btn btn-success btn-sm" onclick="pumpAction('house','force_on')">Принудительно ВКЛ</button>
          <button class="btn btn-secondary btn-sm" onclick="pumpAction('house','force_off')">Принудительно ВЫКЛ</button>
        </div>
      </div>
    </div>

    <div class="col-12">
      <div class="card p-3" id="settings-section">
        <h4>Меню параметров</h4>
        <form id="settingsForm" class="row g-2"></form>
        <div class="mt-2"><button class="btn btn-primary" onclick="saveSettings(event)">Сохранить параметры</button></div>
      </div>
    </div>

    <div class="col-12 col-lg-6"><div class="card p-3"><h5>Логи скважинного</h5><pre id="logs_well" style="min-height:180px; white-space:pre-wrap"></pre><button class="btn btn-outline-danger btn-sm" onclick="clearLogs('well')">Очистить</button></div></div>
    <div class="col-12 col-lg-6"><div class="card p-3"><h5>Логи домашнего</h5><pre id="logs_house" style="min-height:180px; white-space:pre-wrap"></pre><button class="btn btn-outline-danger btn-sm" onclick="clearLogs('house')">Очистить</button></div></div>
  </div>
</div>

<script>
const settingsMeta = [
  ['TARGET_MIN','TARGET_MIN (мин)'],['L_PER_MIN','L_PER_MIN (л/мин)'],['MIN_PAUSE','MIN_PAUSE (мин)'],['MAX_PAUSE','MAX_PAUSE (мин)'],
  ['CURRENT_DRY_WELL','CURRENT_DRY (A, скваж.)'],['CURRENT_OVERLOAD_WELL','CURRENT_OVERLOAD (A, скваж.)'],['CURRENT_EMERGENCY_WELL','CURRENT_EMERGENCY (A, скваж.)'],
  ['CURRENT_MIN_START','CURRENT_MIN_START (A)'],['PRESSURE_MIN_OK','PRESSURE_MIN_OK (бар)'],['PRESSURE_WARNING','PRESSURE_WARNING (бар)'],['PRESSURE_BLOCK','PRESSURE_BLOCK (бар)'],
  ['OVERLOAD_DELAY_MS_WELL','OVERLOAD_DELAY_MS (мс, скваж.)'],['DRY_DELAY_MS_WELL','DRY_DELAY_MS (мс, скваж.)'],['PRESSURE_CHECK_DELAY','PRESSURE_CHECK_DELAY (мс)'],['MAX_FAILED_STARTS','MAX_FAILED_STARTS'],
  ['SETPOINT_BAR','SETPOINT_BAR (бар)'],['HYST_ON','HYST_ON (бар)'],['HYST_OFF','HYST_OFF (бар)'],['MIN_FREQ','MIN_FREQ (Гц)'],['MAX_FREQ','MAX_FREQ (Гц)'],['SHUTDOWN_FREQ','SHUTDOWN_FREQ (Гц)'],
  ['CURRENT_NORMAL_MIN','CURRENT_NORMAL_MIN (A)'],['CURRENT_NORMAL_MAX','CURRENT_NORMAL_MAX (A)'],['CURRENT_DRY_HOUSE','CURRENT_DRY (A, дом.)'],['CURRENT_OVERLOAD_HOUSE','CURRENT_OVERLOAD (A, дом.)'],
  ['CURRENT_EMERGENCY_HOUSE','CURRENT_EMERGENCY (A, дом.)'],['OVERLOAD_DELAY_MS_HOUSE','OVERLOAD_DELAY_MS (мс, дом.)'],['DRY_DELAY_MS_HOUSE','DRY_DELAY_MS (мс, дом.)'],
  ['START_CURRENT_IGNORE_MS','START_CURRENT_IGNORE_MS (мс)'],['DRY_PRESSURE_START_TIMEOUT','DRY_PRESSURE_START_TIMEOUT (мс)'],['DRY_PRESSURE_WORK_TIMEOUT','DRY_PRESSURE_WORK_TIMEOUT (мс)'],
  ['PRESSURE_RISE_THRESHOLD','PRESSURE_RISE_THRESHOLD (бар)'],['Kp','Kp'],['Ki','Ki'],['INTEGRAL_LIMIT','INTEGRAL_LIMIT'],['PID_PERIOD','PID_PERIOD (мс)'],['FREQ_STEP_DELAY','FREQ_STEP_DELAY (мс)'],
  ['LEVEL_FILTER_MS','LEVEL_FILTER_MS (мс)'],['INIT_DELAY_MS','INIT_DELAY_MS (мс)'],['THRESH','THRESH']
];

let settingsCache = {};
function goSettings(){document.getElementById('settings-section').scrollIntoView({behavior:'smooth'});}

function renderState(d){
  document.getElementById('well_current').innerText = d.well_current.toFixed(1)+" A";
  document.getElementById('well_pressure').innerText = d.well_pressure.toFixed(2)+" bar";
  document.getElementById('house_current').innerText = d.house_current.toFixed(1)+" A";
  document.getElementById('house_pressure').innerText = d.house_pressure.toFixed(2)+" bar";
  document.getElementById('last_work_sec').innerText = d.last_work_sec + " s";
  document.getElementById('pause_ms').innerText = d.pause_ms.toFixed(0) + " ms";
  document.getElementById('total_liters').innerText = d.total_liters.toFixed(0) + " L";
  document.getElementById('well_alarm').innerText = d.well_alarm ? 'Да' : 'Нет';
  document.getElementById('house_alarm').innerText = d.house_alarm ? 'Да' : 'Нет';
  document.getElementById('well_blocked').innerText = d.well_blocked ? 'Да' : 'Нет';
  document.getElementById('house_blocked').innerText = d.house_blocked ? 'Да' : 'Нет';
  for(let i=0;i<4;i++) document.getElementById(`sector${i}`).className = `sector ${d.levels[i] ? 'sector-on' : 'sector-off'}`;
}

async function pollState(){ try{ const d=await (await fetch('/state')).json(); renderState(d);}catch(e){} }
async function pumpAction(pump,cmd){ await fetch(`/action?pump=${pump}&cmd=${cmd}`,{method:'POST'}); }
async function loadLogs(){
  document.getElementById('logs_well').innerText = await (await fetch('/logs_well')).text();
  document.getElementById('logs_house').innerText = await (await fetch('/logs_house')).text();
}
async function clearLogs(type){ await fetch(`/clear_logs_${type}`,{method:'POST'}); await loadLogs(); }

function renderSettingsForm(){
  const form = document.getElementById('settingsForm');
  form.innerHTML = '';
  settingsMeta.forEach(([key,label])=>{
    const val = settingsCache[key];
    const block = document.createElement('div');
    block.className='col-12 col-md-6 col-lg-4';
    block.innerHTML = `<label class="form-label mb-0">${label}</label><input class="form-control" id="st_${key}" value="${val ?? ''}">`;
    form.appendChild(block);
  });
}

async function loadSettings(){
  try{
    settingsCache = await (await fetch('/settings')).json();
    renderSettingsForm();
  }catch(e){ console.error(e); }
}

async function saveSettings(e){
  e.preventDefault();
  for(const [key] of settingsMeta){
    const el = document.getElementById(`st_${key}`);
    if(!el) continue;
    await fetch(`/set?param=${encodeURIComponent(key)}&value=${encodeURIComponent(el.value)}`,{method:'POST'});
  }
  await loadSettings();
  alert('Параметры сохранены');
}

setInterval(pollState,1000);
pollState();
loadSettings();
loadLogs();
</script>
</body>
</html>
